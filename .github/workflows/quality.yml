name: Quality & Release Verification

on:
  push:
    branches: [ master, 'feat/*', 'fix/*' ]
  pull_request:
    branches: [ master ]

jobs:
  verify:
    name: Lint, Typecheck, Test & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Full Test Suite
        run: npm test

      - name: Build Web Target
        run: npm run build:web
