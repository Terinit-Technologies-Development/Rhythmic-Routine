name: Bug Report
description: Create a bug report to help improve Rhythmic-Routine.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you do **NOT** paste sensitive private messages, passwords, authentication tokens, or personal identifiers in this report.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform did this issue occur on?
      options:
        - Android (Physical Device)
        - Android (Emulator)
        - iOS (Experimental Foundation)
        - Web (Development Demo)
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Operating System & Version
      description: e.g., Android 14 (API 34), OxygenOS 14, iOS 17.5, Windows 11
      placeholder: Android 14
    validations:
      required: true
  - type: input
    id: version_commit
    attributes:
      label: App Version / Commit SHA
      description: e.g., 1.0.0 or commit hash
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: build_mode
    attributes:
      label: Build Mode
      description: How was the app compiled or executed?
      options:
        - Standalone QA APK (assembleQaStandalone)
        - Rhythm Development Client (assembleDebug / start:dev)
        - Expo Go (start:go)
        - Web Demo (npm run web)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: What steps lead to this issue?
      placeholder: |
        1. Open Rhythm and navigate to Routine tab.
        2. Set Evening Wind-Down start time.
        3. Open a restricted Risk app.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized Diagnostic Logs
      description: Please paste relevant logcat or technical console output (ensure no private data is included).
      render: shell
